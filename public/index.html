<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MH | Iraqi Tech Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060606;color:#eee;font-family:Arial,sans-serif}.top{text-align:center;padding:8px;background:#101010;color:#aaa;font-size:12px}header{position:sticky;top:0;z-index:5;background:#080808ee;border-bottom:1px solid #252525;padding:16px 5%;display:flex;gap:25px;align-items:center}.logo{font-size:30px;font-weight:900;letter-spacing:3px}.logo i{color:#666;font-style:normal}.nav{display:flex;gap:20px;flex:1;color:#aaa}.nav a{color:inherit;text-decoration:none}.hero{padding:80px 5%;min-height:560px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;background:radial-gradient(circle at 75%,#262626,#060606 58%)}h1{font-size:clamp(45px,7vw,85px);line-height:.95;margin:15px 0}.muted{color:#999;line-height:1.9}.visual{height:390px;border:1px solid #333;border-radius:30px;background:linear-gradient(145deg,#1d1d1d,#090909);display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:900}.wrap{padding:55px 5%}.head{margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#101010;border:1px solid #292929;border-radius:17px;overflow:hidden}.photo{height:210px;background:#171717;display:flex;align-items:center;justify-content:center;font-size:70px}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.body h3{margin:0 0 7px}.price{font-size:19px;font-weight:bold}.old{text-decoration:line-through;color:#666;font-size:11px}.stock{color:#777;font-size:11px;margin-top:5px}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:bold;background:#fff;color:#000}.dark{background:#151515;color:#fff;border:1px solid #333}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1}.cart{position:fixed;bottom:18px;left:18px;border:0;border-radius:50px;padding:13px 18px;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#101010;border:1px solid #333;border-radius:20px;padding:22px}.field{margin:9px 0}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;background:#080808;color:#fff;border:1px solid #333;border-radius:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay button{padding:11px;background:#080808;color:#fff;border:1px solid #333;border-radius:9px}.pay button.active{background:#fff;color:#000}.order{border:1px solid #292929;padding:12px;border-radius:11px;margin:8px 0}.danger{color:#f66}.mini{padding:7px 10px;border:1px solid #333;background:#151515;color:#fff;border-radius:8px}.adminbar{position:fixed;bottom:18px;right:18px;border:0;border-radius:10px;padding:12px;background:#fff;color:#000;font-weight:bold}
@media(max-width:850px){.hero{grid-template-columns:1fr}.nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.row,.pay{grid-template-columns:1fr}.visual{height:280px}}
</style></head><body>
<div class="top">🇮🇶 توصيل كافة المحافظات • ZainCash والتحويل • WhatsApp</div>
<header><div class="logo">M<i>H</i></div><nav class="nav"><a href="#products">المتجر</a><a href="#gaming">Gaming</a><a href="#internet">Internet</a><a href="#digital">Digital</a></nav><button onclick="openCart()">🛒</button></header>
<section class="hero"><div><div class="muted">MH IRAQI TECH STORE</div><h1>تقنية.<br><span style="color:#777">Gaming.</span><br>Internet.</h1><p class="muted">متجر عراقي احترافي للإلكترونيات والألعاب وأجهزة الإنترنت والمنتجات الرقمية.</p><a class="btn" href="#products">تسوق الآن</a></div><div class="visual">MH</div></section>
<section class="wrap" id="products"><div class="head"><h2>🛍️ كل المنتجات</h2></div><div class="grid" id="grid"></div></section>
<section class="wrap" id="gaming"><div class="head"><h2>🎮 Gaming</h2></div><div class="grid" id="gamingGrid"></div></section>
<section class="wrap" id="internet"><div class="head"><h2>🌐 Internet</h2></div><div class="grid" id="internetGrid"></div></section>
<section class="wrap" id="digital"><div class="head"><h2>📲 Digital</h2></div><div class="grid" id="digitalGrid"></div></section>
<button class="cart" onclick="openCart()">🛒 السلة <b id="cnt">0</b></button><button class="adminbar" onclick="adminLogin()">⚙ الإدارة</button>
<div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h2 id="title">MH</h2><button onclick="closeM()">×</button></div><div id="body"></div></div></div>
<script>
let products=[],cart=[],pay="zain";
const fmt=n=>Number(n).toLocaleString("ar-IQ")+" د.ع";
async function load(){products=await fetch("/api/products").then(r=>r.json());render()}
function card(p){return `<article class="card"><div class="photo">${p.image?`<img src="${p.image}">`:(p.category==="gaming"?"🎮":p.category==="internet"?"🌐":"📲")}</div><div class="body"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description)}</div><div><span class="price">${fmt(p.price)}</span> <span class="old">${p.old_price?fmt(p.old_price):""}</span></div><div class="stock">المخزون: ${p.stock}</div><div class="actions"><button class="dark" onclick="add(${p.id})">أضف للسلة</button><button class="btn" onclick="buy(${p.id})">شراء الآن</button></div></div></article>`}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){for(const [id,f] of [["grid",()=>1],["gamingGrid",p=>p.category==="gaming"],["internetGrid",p=>p.category==="internet"],["digitalGrid",p=>p.category==="digital"]])document.getElementById(id).innerHTML=products.filter(f).map(card).join("");document.getElementById("cnt").textContent=cart.length}
function add(id){let p=products.find(x=>x.id===id);if(p)cart.push({id:p.id,name:p.name,price:p.price,qty:1});render()}
function buy(id){cart=[{id,qty:1}];checkout()}
function openCart(){modal("السلة",cart.length?cart.map((x,i)=>{let p=products.find(p=>p.id===x.id);return `<div class="order">${esc(p.name)} — ${fmt(p.price)} <button class="mini danger" onclick="cart.splice(${i},1);openCart();render()">حذف</button></div>`}).join("")+`<button class="btn" style="width:100%" onclick="checkout()">إتمام الطلب</button>`:"السلة فارغة")}
function checkout(){if(!cart.length)return;modal("إتمام الطلب",`<div class="row"><div class="field"><label>الاسم</label><input id="n"></div><div class="field"><label>الهاتف</label><input id="ph"></div><div class="field"><label>المحافظة</label><select id="g">${["بغداد","نينوى","البصرة","أربيل","السليمانية","دهوك","النجف","كربلاء","بابل","واسط","ديالى","الأنبار","صلاح الدين","كركوك","القادسية","المثنى","ذي قار","ميسان"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>العنوان</label><input id="a"></div></div><div class="field"><label>الدفع</label><div class="pay"><button id="z" class="active" onclick="choose('zain')">📲 ZainCash</button><button id="m" onclick="choose('master')">💳 تحويل حساب</button><button id="w" onclick="choose('wa')">💬 WhatsApp</button></div></div><div id="pi" class="order"></div><div class="field"><label>إيصال التحويل</label><input id="rec" type="file" accept="image/*"></div><button class="btn" style="width:100%" onclick="submitOrder()">تأكيد الطلب</button>`);choose("zain")}
function choose(x){pay=x;["z","m","w"].forEach(i=>document.getElementById(i)?.classList.remove("active"));document.getElementById(x==="zain"?"z":x==="master"?"m":"w").classList.add("active");document.getElementById("pi").innerHTML=x==="zain"?"حوّل إلى ZainCash ثم ارفع الإيصال.":x==="master"?"حوّل إلى رقم الحساب/البطاقة المعلن من MH ثم ارفع الإيصال.":"سيتم تسجيل الطلب وإرسال تفاصيله عبر WhatsApp عند إضافة رقم المتجر."}
async function submitOrder(){let fd=new FormData();fd.append("name",n.value);fd.append("phone",ph.value);fd.append("governorate",g.value);fd.append("address",a.value);fd.append("payment_method",pay);fd.append("items",JSON.stringify(cart));let f=rec.files[0];if(f)fd.append("receipt",f);let r=await fetch("/api/orders",{method:"POST",body:fd}),d=await r.json();if(!r.ok)return alert(d.error);alert("تم تسجيل الطلب: "+d.order_code);cart=[];render();closeM()}
async function adminLogin(){modal("دخول الإدارة",`<div class="field"><input id="au" placeholder="اسم المستخدم"></div><div class="field"><input id="ap" type="password" placeholder="كلمة المرور"></div><button class="btn" onclick="login()">دخول</button>`)}
async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:au.value,password:ap.value})});if(!r.ok)return alert("بيانات الدخول غير صحيحة");adminPanel()}
async function adminPanel(){let ps=await fetch("/api/admin/products").then(r=>r.json()),os=await fetch("/api/admin/orders").then(r=>r.json());modal("لوحة الإدارة",`<button class="btn" onclick="addProduct()">+ إضافة منتج</button><h3>المنتجات</h3>${ps.map(p=>`<div class="order"><b>${esc(p.name)}</b> — ${fmt(p.price)} — مخزون ${p.stock}<br><button class="mini" onclick="editProduct(${p.id})">تعديل</button> <button class="mini danger" onclick="deleteProduct(${p.id})">حذف</button></div>`).join("")}<h3>الطلبات</h3>${os.map(o=>`<div class="order"><b>${o.order_code}</b> — ${esc(o.name)} — ${fmt(o.total)}<br>${esc(o.govorate||o.governorate)}<br>الدفع: ${esc(o.payment_method)} — <b>${esc(o.status)}</b>${o.receipt_image?`<br><a target="_blank" href="${o.receipt_image}">عرض الإيصال</a>`:""}<br><button class="mini" onclick="status(${o.id},'تم تأكيد الدفع')">تأكيد الدفع</button> <button class="mini" onclick="status(${o.id},'قيد التجهيز')">تجهيز</button> <button class="mini" onclick="status(${o.id},'تم الشحن')">شحن</button> <button class="mini" onclick="status(${o.id},'تم التسليم')">تسليم</button></div>`).join("")}`)}
function addProduct(){productForm()}
function editProduct(id){productForm(id)}
async function productForm(id){let p=id?await fetch("/api/products/"+id).then(r=>r.json()):{};modal(id?"تعديل المنتج":"إضافة منتج",`<div class="row"><div class="field"><label>الاسم</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>السعر</label><input id="pp" type="number" value="${p.price||0}"></div><div class="field"><label>السعر القديم</label><input id="po" type="number" value="${p.old_price||0}"></div><div class="field"><label>المخزون</label><input id="ps" type="number" value="${p.stock||0}"></div><div class="field"><label>القسم</label><select id="pc"><option value="gaming">Gaming</option><option value="internet">Internet</option><option value="electronics">Electronics</option><option value="digital">Digital</option></select></div><div class="field"><label>الشارة</label><input id="pt" value="${esc(p.tag)}"></div></div><div class="field"><label>الوصف</label><textarea id="pd">${esc(p.description)}</textarea></div><div class="field"><label>الصورة</label><input id="pf" type="file" accept="image/*"></div><button class="btn" onclick="saveProduct(${id||0})">حفظ</button>`);if(id)pc.value=p.category}
async function saveProduct(id){let fd=new FormData();fd.append("name",pn.value);fd.append("price",pp.value);fd.append("old_price",po.value);fd.append("stock",ps.value);fd.append("category",pc.value);fd.append("tag",pt.value);fd.append("description",pd.value);if(pf.files[0])fd.append("image",pf.files[0]);let r=await fetch(id?"/api/admin/products/"+id:"/api/admin/products",{method:id?"PUT":"POST",body:fd});if(!r.ok)return alert("تعذر الحفظ");adminPanel();load()}
async function deleteProduct(id){if(!confirm("حذف المنتج؟"))return;await fetch("/api/admin/products/"+id,{method:"DELETE"});adminPanel();load()}
async function status(id,s){await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});adminPanel()}
function modal(t,b){title.textContent=t;body.innerHTML=b;modalEl().classList.add("open")}function modalEl(){return document.getElementById("modal")}function closeM(){modalEl().classList.remove("open")}
load();
</script></body></html>
